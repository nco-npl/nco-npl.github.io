<!DOCTYPE html>
<html lang="ne">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>हाम्रो सेरोफेरो - कक्षा १</title>

    <!-- FIX 1: Devanagari font from Google Fonts for cross-platform Nepali text rendering -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #4a90e2;
            --primary-dark: #357abd;
            --text-color: #2c3e50;
            --muted-color: #6b7280;
            --page-bg: #f6f8fb;
            --surface-color: #ffffff;
            --border-color: #e5edf7;
            --focus-ring: rgba(74, 144, 226, 0.24);
            --shadow-lg: 0 16px 40px rgba(15, 23, 42, 0.14);
            --radius-md: 12px;
            --content-width: 1024px;
            --transition: 260ms ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            height: 100%;
        }

        body {
            /* FIX 4: removed -webkit-fill-available; 100dvh handles mobile browser chrome correctly */
            min-height: 100vh;
            min-height: 100dvh;
            /* FIX 1: Noto Sans Devanagari first for correct Nepali rendering on all platforms */
            font-family: "Noto Sans Devanagari", "Mangal", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            color: var(--text-color);
            background: var(--page-bg);
            -webkit-font-smoothing: antialiased;
        }

        button,
        a {
            font: inherit;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .app-shell {
            width: min(100%, var(--content-width));
            /* FIX 4: removed -webkit-fill-available; dvh is the modern standard */
            height: 100vh;
            height: 100dvh;
            margin: 0 auto;
            background: var(--surface-color);
            position: relative;
            overflow: hidden;
        }

        .page {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: clamp(12px, 2.6vw, 24px);
            background: var(--surface-color);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: translateX(48px);
            transition: opacity var(--transition), transform var(--transition), visibility var(--transition);
        }

        .page.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            transform: translateX(0);
            z-index: 2;
        }

        .page.exit-left {
            transform: translateX(-48px);
        }

        .cover-page {
            overflow-y: auto;
        }

        .toc-page {
            overflow: hidden;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            flex: 0 0 auto;
            min-height: 44px;
            margin-bottom: 12px;
        }

        .cover-content {
            /* flex: 1 + min-height: 0 would clip content and prevent scroll from firing.
               min-height: min-content lets the column grow naturally so .cover-page
               overflow-y: auto can actually kick in on short / landscape screens. */
            flex: 1 0 auto;
            min-height: min-content;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 12px;
            padding-bottom: calc(54px + max(12px, env(safe-area-inset-bottom)));
            text-align: center;
        }

        .main-title {
            flex: 0 0 auto;
            font-size: clamp(1.7rem, 5vw, 2.6rem);
            line-height: 1.18;
            font-weight: 700;
            color: var(--text-color);
        }

        .sub-title {
            flex: 0 0 auto;
            font-size: clamp(1.05rem, 3vw, 1.45rem);
            line-height: 1.3;
            font-weight: 500;
            color: var(--muted-color);
        }

        .cover-image-wrapper {
            width: 100%;
            /* flex: 1 1 0 + overflow: hidden would swallow the image on short screens.
               Use a fixed min-height so the image always has room, and let it grow. */
            flex: 1 0 auto;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cover-image {
            display: block;
            width: auto;
            /* FIX 2: explicit max-height prevents overflow on short/landscape screens */
            height: auto;
            max-height: clamp(180px, 50vh, 600px);
            max-width: 100%;
            object-fit: contain;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-lg);
        }

        .action-row {
            width: 100%;
            flex: 0 0 auto;
            /* FIX 3: removed dead left/right/bottom offsets (position was never absolute/fixed) */
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            padding: 12px 12px max(12px, env(safe-area-inset-bottom));
            background: var(--surface-color);
        }

        .btn {
            min-height: 42px;
            border: 0;
            border-radius: 999px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            line-height: 1.2;
            transition: background-color 180ms ease, border-color 180ms ease, color 180ms ease, transform 180ms ease, box-shadow 180ms ease;
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(0) scale(0.98);
        }

        .primary-btn {
            min-width: 150px;
            padding: 12px 28px;
            background: var(--primary-color);
            color: #ffffff;
            font-size: 1.05rem;
            font-weight: 700;
            box-shadow: 0 8px 20px rgba(74, 144, 226, 0.28);
        }

        .primary-btn:hover {
            background: var(--primary-dark);
            box-shadow: 0 11px 24px rgba(74, 144, 226, 0.34);
        }

        .secondary-btn {
            min-width: 116px;
            padding: 10px 16px;
            color: var(--primary-color);
            background: transparent;
            border: 1px solid rgba(74, 144, 226, 0.32);
            font-weight: 700;
        }

        .secondary-btn:hover {
            background: #f1f7ff;
            border-color: var(--primary-color);
        }

        .toc-frame-wrap {
            flex: 1;
            /* FIX 5: min-height: 0 is required so the flex child can actually shrink in Safari */
            min-height: 0;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            overflow: hidden;
            background: #ffffff;
        }

        .toc-iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
            background: #ffffff;
        }

        :focus-visible {
            outline: 3px solid var(--primary-color);
            outline-offset: 3px;
            box-shadow: 0 0 0 6px var(--focus-ring);
        }

        @media (max-width: 640px) {
            .page {
                padding: 12px;
            }

            .top-bar {
                min-height: 40px;
            }

            .cover-content {
                justify-content: flex-start;
            }
        }

        @media (max-width: 380px) {
            .action-row {
                flex-direction: column;
                align-items: stretch;
            }

            .action-row .btn {
                width: 100%;
                max-width: none;
            }
        }

        /* Landscape on short screens: reduce image area to keep buttons visible */
        @media (max-height: 500px) {
            .cover-image {
                max-height: 40vh;
            }

            .cover-content {
                gap: 8px;
            }

            .main-title {
                font-size: 1.3rem;
            }

            .sub-title {
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>
    <main class="app-shell" aria-live="polite">
        <section id="coverPage" class="page cover-page active" aria-labelledby="coverTitle">
            <nav class="top-bar" aria-label="मुख्य पृष्ठमा फर्कने">
                <a class="btn secondary-btn" href="index.html">
                    <span aria-hidden="true">←</span>
                    <span>पछाडि</span>
                </a>
            </nav>

            <div class="cover-content">
                <h1 id="coverTitle" class="main-title">हाम्रो सेरोफेरो</h1>
                <p class="sub-title">कक्षा १</p>

                <div class="cover-image-wrapper">
                    <img class="cover-image" src="cover_image_enhanced.png"
                        alt="हाम्रो सेरोफेरो, कक्षा १ को पाठ्यपुस्तकको आवरण चित्र">
                </div>

                <div class="action-row">
                    <button id="openTocBtn" class="btn primary-btn" type="button">
                        <span>विषयसूची</span>
                        <span aria-hidden="true">→</span>
                    </button>
                    <a class="btn secondary-btn" href="adt_user_manual/index.html" target="_blank"
                        rel="noopener noreferrer">
                        <span>प्रयोगकर्ता निर्देशिका</span>
                        <span aria-hidden="true">↗</span>
                        <span class="sr-only">नयाँ ट्याबमा खुल्छ</span>
                    </a>
                </div>
            </div>
        </section>

        <section id="tocPage" class="page toc-page" aria-labelledby="tocTitle" aria-hidden="true">
            <nav class="top-bar" aria-label="आवरणमा फर्कने">
                <button id="backBtn" class="btn secondary-btn" type="button">
                    <span aria-hidden="true">←</span>
                    <span>पछाडि</span>
                </button>
            </nav>

            <h2 id="tocTitle" class="sr-only">विषयसूची</h2>
            <div class="toc-frame-wrap">
                <iframe class="toc-iframe" src="toc.html" title="विषयसूची"></iframe>
            </div>
        </section>
    </main>

    <script>
        const coverPage = document.getElementById("coverPage");
        const tocPage = document.getElementById("tocPage");
        const openTocBtn = document.getElementById("openTocBtn");
        const backBtn = document.getElementById("backBtn");

        // FIX 6: explicitly remove exit-left on each transition to prevent stale transform flash
        function setActivePage(pageToShow) {
            const showingToc = pageToShow === tocPage;

            coverPage.classList.remove("active", "exit-left");
            tocPage.classList.remove("active", "exit-left");

            if (showingToc) {
                coverPage.classList.add("exit-left");
                tocPage.classList.add("active");
            } else {
                coverPage.classList.add("active");
            }

            coverPage.setAttribute("aria-hidden", String(showingToc));
            tocPage.setAttribute("aria-hidden", String(!showingToc));

            requestAnimationFrame(() => {
                (showingToc ? backBtn : openTocBtn).focus();
            });
        }

        openTocBtn.addEventListener("click", () => setActivePage(tocPage));
        backBtn.addEventListener("click", () => setActivePage(coverPage));

        document.addEventListener("keydown", (event) => {
            if (event.key === "Escape" && tocPage.classList.contains("active")) {
                setActivePage(coverPage);
            }
        });
    </script>
</body>

</html>
